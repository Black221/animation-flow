# Load balancer in front of several API processes (docker-compose.cluster.yml). No affinity needed: live editing
# is shared between the processes through PostgreSQL. Put HTTPS in front of this (or terminate it here).
events {}

http {
  # Docker's DNS, asked again every 10 s: replicas added or removed (`--scale app=N`) are followed
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # projects and voice uploads go up to 8 MB (the API refuses more)
  client_max_body_size 10m;
  access_log off;

  server {
    listen 80;
    location / {
      set $app http://app:3000;
      proxy_pass $app;
      proxy_http_version 1.1;
      # the API compares the page's origin with the host it was asked for (live editing)
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # WebSocket (live editing): upgrade, and let quiet connections live (the API pings every 30 s)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
      # videos stream with byte ranges
      proxy_buffering off;
    }
  }
}
