# Load balancer in front of several API processes (docker-compose.cluster.yml). No affinity needed: live editing
# is shared between the processes through PostgreSQL. Put HTTPS in front of this (or terminate it here).
events {}

http {
  # Docker's DNS, asked again every 10 s: replicas added or removed (`--scale app=N`) are followed
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # projects and JSON bodies go up to 8 MB (the API refuses more); files people bring have their own location below
  client_max_body_size 10m;
  access_log off;

  server {
    listen 80;
    set $app http://app:3000;
    # inherited by the locations below (none of them sets its own headers)
    proxy_http_version 1.1;
    # the API compares the page's origin with the host it was asked for (live editing)
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket (live editing): upgrade, and let quiet connections live (the API pings every 30 s)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # nginx (the free one) probes nothing itself: Docker's healthcheck asks each replica /api/ready. Here, a replica that
    # is gone (502) or answers 503 (its database is out of reach) passes the request to another one; a write already
    # sent is never replayed
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    # the readiness probe says which part is down: for this network only (Docker's healthcheck asks each replica
    # directly). Behind a public proxy that reaches nginx from inside, restrict it there too. Each replica answers for
    # itself: no passing to another one
    location = /api/ready {
      allow 127.0.0.1; allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all;
      proxy_next_upstream off;
      proxy_pass $app;
    }

    # files brought with a prompt: pictures up to 15 MB and music up to 60 MB (apps/api/src/routes/uploads.ts). nginx
    # takes the whole file first (a slow sender does not hold an API process), then the API decodes it, which for a
    # long music takes a while
    location /api/uploads/ {
      client_max_body_size 64m;
      client_body_timeout 120s;
      proxy_send_timeout 120s;
      proxy_read_timeout 300s;
      proxy_pass $app;
    }

    location / {
      proxy_read_timeout 1h;
      # videos stream with byte ranges
      proxy_buffering off;
      proxy_pass $app;
    }
  }
}
