# Local deployment: the application (API + editor) and PostgreSQL.
#   cp .env.example .env    # then fill in APP_ENCRYPTION_KEY (openssl rand -base64 32)
#   docker compose up --build
#   → http://localhost:3000
# More rendering machines on this host (they share the database and the videos volume):
#   docker compose --profile workers up --build --scale worker=2
# Several API processes behind a load balancer: see docker-compose.cluster.yml
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: af
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-af}
      POSTGRES_DB: af
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U af -d af"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://af:${POSTGRES_PASSWORD:-af}@db:5432/af
      # encrypts the API keys stored in the database: keep it safe, changing it makes stored keys unreadable
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      # who may create an account: invite (default: the first account, then invited people) or open
      SIGNUP: ${SIGNUP:-invite}
      # the session cookie gets the Secure flag behind HTTPS (detected from X-Forwarded-Proto); force it with true
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # threads per render job (default: CPU count − 1)
      RENDER_THREADS: ${RENDER_THREADS:-}
      # e-mail, optional (invitations, forgotten passwords): the three together; APP_URL is the public address
      # behind your own reverse proxy: true (see TRUST_PROXY in the README); docker-compose.cluster.yml sets it
      TRUST_PROXY: ${TRUST_PROXY:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_URL: ${APP_URL:-}
      # plans and quotas: on (Gratuit · Basique · Premium · Pro) or off (nothing limited, e.g. for a private server)
      PLANS: ${PLANS:-on}
      # paying for a plan, optional: all five together, with APP_URL; the webhook goes to APP_URL/api/billing/webhook
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_BASIC: ${STRIPE_PRICE_BASIC:-}
      STRIPE_PRICE_PREMIUM: ${STRIPE_PRICE_PREMIUM:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
    volumes:
      - data:/data   # rendered videos
    ports:
      # local only; put a reverse proxy with HTTPS in front before exposing it
      - "127.0.0.1:${PORT:-3000}:3000"
    restart: unless-stopped

  # extra render workers (optional): no HTTP, they only take jobs from the queue
  worker:
    build: .
    profiles: ["workers"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ROLE: worker
      DATABASE_URL: postgres://af:${POSTGRES_PASSWORD:-af}@db:5432/af
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      RENDER_THREADS: ${RENDER_THREADS:-}
    volumes:
      - data:/data
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  pgdata:
  data:
